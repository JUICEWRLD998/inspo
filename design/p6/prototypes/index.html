<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,"><title>P6 hero directions (prototype surface, not production)</title>
<link rel="stylesheet" href="/app/src/styles/tokens.css">
<style>
@font-face { font-family: "Caprasimo"; src: url("/app/node_modules/@fontsource/caprasimo/files/caprasimo-latin-400-normal.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Figtree Variable"; src: url("/app/node_modules/@fontsource-variable/figtree/files/figtree-latin-wght-normal.woff2") format("woff2"); font-weight: 300 900; font-display: swap; }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); line-height: 1.5; }
h1, h2 { font-family: var(--font-display); font-weight: 400; line-height: 1.05; margin: 0; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
button, a { font: inherit; }
.num { font-variant-numeric: tabular-nums; }

/* shared chrome */
.notice { padding: 0.5rem 1rem; background: var(--blush); font-size: 0.875rem; text-align: center; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem clamp(1rem, 4vw, 3rem); }
.brand { font-family: var(--font-display); font-size: 1.25rem; }
.top nav { display: flex; gap: 1.5rem; font-weight: 500; font-size: 0.9375rem; color: var(--ink-2); }
.top nav a { color: inherit; text-decoration: none; min-height: 2.75rem; display: inline-flex; align-items: center; }
@media (max-width: 40rem) { .top nav a:not(.keep) { display: none; } }
.cta { display: inline-flex; align-items: center; justify-content: center; min-height: 3.25rem; padding: 0 1.75rem; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 700; text-decoration: none; transition: background 140ms var(--ease-out), transform 140ms var(--ease-out); }
.cta:hover { background: var(--accent-hover); }
.cta:active { transform: scale(0.97); }
.fine { color: var(--ink-2); font-size: 0.9375rem; }

/* docket (shared object) */
.docket { position: relative; background: var(--card); width: min(100%, 22rem); padding: 1.1rem 1.25rem 1.6rem; box-shadow: 0 1px 0 oklch(26% 0.04 40 / .06), 0 14px 30px -12px oklch(26% 0.04 40 / .35); border-top: 6px solid var(--foil); }
.docket::after { content: ""; position: absolute; left: 0; right: 0; bottom: -7px; height: 8px; background: radial-gradient(circle at 6px -1px, transparent 5px, var(--card) 5.5px) 0 0 / 12px 8px repeat-x; }
.docket h3 { margin: 0 0 .6rem; font-size: .8125rem; font-weight: 700; letter-spacing: 0; color: var(--ink-2); display: flex; justify-content: space-between; }
.row { display: flex; justify-content: space-between; gap: 1rem; padding: .45rem 0; border-bottom: 1px dashed var(--line); }
.row small { display: block; color: var(--ink-2); font-size: .8125rem; line-height: 1.3; }
.total { display: flex; justify-content: space-between; align-items: baseline; padding-top: .7rem; }
.total strong { font-family: var(--font-display); font-weight: 400; font-size: 2.1rem; }
.dep { display: flex; justify-content: space-between; color: var(--ink-2); font-size: .9375rem; }
.stamp { position: absolute; right: .9rem; bottom: 1.1rem; transform: rotate(-7deg); border: 3px solid var(--accent); color: var(--accent); border-radius: .4rem; padding: .15rem .55rem; font-weight: 800; font-size: .8125rem; line-height: 1.15; text-align: center; background: color-mix(in oklch, var(--card) 70%, transparent); }

.print > * { animation: print 520ms var(--ease-out) both; }
.print > *:nth-child(2) { animation-delay: 180ms; } .print > *:nth-child(3) { animation-delay: 300ms; }
.print > *:nth-child(4) { animation-delay: 420ms; } .print > *:nth-child(5) { animation-delay: 560ms; }
@keyframes print { from { opacity: 0; transform: translateY(-8px); } }
.stamp { animation: stamp 320ms 900ms var(--ease-out) both; }
@keyframes stamp { from { opacity: 0; transform: rotate(-7deg) scale(1.5); } }
@media (prefers-reduced-motion: reduce) { .print > *, .stamp { animation: none; } }

/* ---- Variant A: Docket ---- */
.a { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(1.5rem, 4vw, 4rem); align-items: center; padding: clamp(1rem, 3vw, 2.5rem) clamp(1rem, 4vw, 3rem) 4rem; max-width: 80rem; margin: 0 auto; }
.a h1 { font-size: clamp(2.4rem, 5.2vw, 4.4rem); }
.a .copy { display: grid; gap: 1.25rem; justify-items: start; }
.a .copy p { max-width: 34ch; font-size: 1.125rem; }
.a .stage { position: relative; padding-bottom: 5rem; }
.a .photo { width: 88%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: .9rem; display: block; }
.a .docket { position: absolute; right: 0; bottom: 0; transform: rotate(1.6deg); }
@media (max-width: 52rem) { .a { grid-template-columns: minmax(0, 1fr); } .a .stage { padding-bottom: 7rem; } .a .photo { width: 100%; } .a .docket { right: 0.25rem; width: min(92%, 22rem); } }

/* ---- Variant B: Tag ---- */
.b { position: relative; display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); min-height: min(46rem, 85vh); }
.b .panel { padding: clamp(1.5rem, 4vw, 3.5rem); display: grid; align-content: center; gap: 1.25rem; justify-items: start; background: var(--paper-2); }
.b h1 { font-size: clamp(2.3rem, 4.4vw, 3.8rem); }
.b .panel p { max-width: 30ch; font-size: 1.125rem; }
.b .frame { position: relative; overflow: hidden; }
.b .frame img { width: 100%; height: 100%; object-fit: cover; display: block; min-height: 22rem; }
.b .tag { position: absolute; top: 8%; right: clamp(1rem, 6%, 4rem); width: min(78%, 15rem); transform-origin: 50% -2.5rem; transform: rotate(4deg); background: var(--card); border-radius: .6rem; padding: 1.4rem 1.1rem 1rem; box-shadow: 0 14px 28px -12px oklch(26% 0.04 40 / .45); }
.b .tag::before { content: ""; position: absolute; top: .55rem; left: 50%; width: .75rem; height: .75rem; margin-left: -.375rem; border-radius: 50%; background: var(--paper-2); box-shadow: inset 0 1px 2px oklch(26% 0.04 40 / .4); }
.b .tag::after { content: ""; position: absolute; top: -3rem; left: 50%; width: 2px; height: 3.5rem; background: var(--foil); }
.b .tag strong { font-family: var(--font-display); font-weight: 400; font-size: 2.2rem; display: block; line-height: 1; }
.b .tag .row { font-size: .875rem; }
@media (max-width: 52rem) { .b { grid-template-columns: minmax(0, 1fr); } .b .frame img { min-height: 18rem; aspect-ratio: 4 / 3; } .b .tag { top: auto; bottom: 1rem; right: 1rem; } }

/* ---- Variant C: Thread ---- */
.c { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 6fr); gap: clamp(1.5rem, 5vw, 5rem); align-items: center; padding: clamp(1.5rem, 4vw, 3.5rem) clamp(1rem, 4vw, 3rem) 4rem; max-width: 80rem; margin: 0 auto; }
.c h1 { font-size: clamp(2.4rem, 5vw, 4.4rem); }
.c .copy { display: grid; gap: 1.25rem; justify-items: start; }
.c .copy p { max-width: 36ch; font-size: 1.125rem; }
.thread { display: grid; gap: .75rem; padding: 1.25rem; background: var(--blush); border-radius: 1.25rem; }
.msg { max-width: 82%; border-radius: 1rem; padding: .5rem; background: var(--card); box-shadow: 0 1px 0 oklch(26% 0.04 40 / .08); animation: pop 360ms var(--ease-out) both; }
.msg.out { justify-self: end; border-bottom-right-radius: .25rem; }
.msg.in { justify-self: start; border-bottom-left-radius: .25rem; max-width: 92%; padding: .9rem 1rem; animation-delay: 700ms; }
.msg img { display: block; width: 100%; border-radius: .6rem; aspect-ratio: 4 / 3; object-fit: cover; }
.msg .cap { padding: .35rem .35rem .1rem; font-size: .9375rem; }
.msg.in .total strong { font-size: 1.7rem; }
.msg .wait { margin-top: .5rem; font-size: .875rem; color: var(--check); background: var(--check-bg); border-radius: .5rem; padding: .35rem .6rem; }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.97); } }
@media (prefers-reduced-motion: reduce) { .msg { animation: none; } }
@media (max-width: 52rem) { .c { grid-template-columns: minmax(0, 1fr); } }

#stage { min-height: 100vh; }
</style>
<style id="picker-css">
.proto-picker { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10, 10, 10, 0.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
.proto-picker-highlight { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); will-change: transform; }
.proto-picker[data-ready] .proto-picker-highlight { transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1), width 250ms cubic-bezier(0.23, 1, 0.32, 1); }
@media (prefers-reduced-motion: reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition: none; } }
.proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, 0.55); font: inherit; cursor: pointer; transition: color 150ms ease-out; }
.proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
.proto-picker-item:active { transform: scale(0.97); }
.proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
.proto-picker-item[data-active] { color: #fff; }
.proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
.proto-picker-replay { padding: 0 10px; font-size: 14px; }
.proto-picker[data-position="top"] { bottom: auto; top: 24px; }
</style>
</head>
<body>
<div id="stage"></div>
<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Docket</button>
  <button class="proto-picker-item">Tag</button>
  <button class="proto-picker-item">Thread</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>
<script>
let Q;
const IMG = "/app/public/imagery/layer-cake.webp";
const ALT = "A layered sponge cake with buttercream rosettes and a slice cut out";
const siteTop = () => `
  <div class="notice">Sample studio: an invented bakery used to show how Inspo works.</div>
  <header class="top"><span class="brand">Aminat's Cake Studio</span>
    <nav><a href="#">Prices</a><a href="#">How it works</a><a href="#">Questions</a><a class="keep" href="#">Maker sign in</a></nav></header>`;
const lines = () => Q.quote.line_items.map((l) => `<div class="row"><span>${l.label}${l.note ? `<small>Range ${"₦5,000 to ₦12,000"}. Aminat picks the amount.</small>` : ""}</span><span class="num">${l.amount_display}</span></div>`).join("");
const docketBody = () => `
  <h3><span>Quote from your photo</span><span>SAMPLE</span></h3>
  ${lines()}
  <div class="total"><span>Total</span><strong class="num">${Q.quote.total_display}</strong></div>
  <div class="dep"><span>70% deposit</span><span class="num">${Q.quote.deposit_display}</span></div>
  <div class="stamp">WAITING FOR<br>AMINAT</div>`;

const variants = [
  () => `${siteTop()}<main class="a">
    <div class="copy"><h1>Send the cake you want. Get the price.</h1>
      <p>Send a photo of the cake you have in mind on WhatsApp. You get a price from Aminat's own price list, and she confirms it before anything is final.</p>
      <a class="cta" href="#">Send us your inspo</a><p class="fine">Opens WhatsApp.</p></div>
    <div class="stage"><img class="photo" src="${IMG}" alt="${ALT}" width="828" height="643"><div class="docket print">${docketBody().replace(/<h3>.*?<\/h3>/s, (m) => m)}</div></div></main>`,
  () => `${siteTop()}<main class="b">
    <div class="panel"><h1>No more "DM for price."</h1>
      <p>Send a photo of the cake you want. Get a price from Aminat's own list, in the chat.</p>
      <a class="cta" href="#">Send us your inspo</a></div>
    <div class="frame"><img src="${IMG}" alt="${ALT}" width="828" height="643">
      <div class="tag print"><h3><span>Your quote</span><span>SAMPLE</span></h3><strong class="num">${Q.quote.total_display}</strong>${lines()}<div class="stamp">WAITING FOR<br>AMINAT</div></div></div></main>`,
  () => `${siteTop()}<main class="c">
    <div class="copy"><h1>Send the inspo. Get the price.</h1>
      <p>Message the studio a picture of the cake you want. The reply is a real quote, worked out from Aminat's price list. She approves it before it is final.</p>
      <a class="cta" href="#">Send us your inspo</a></div>
    <div class="thread" aria-label="Example chat">
      <div class="msg out"><img src="${IMG}" alt="${ALT}" width="828" height="643"><p class="cap">Hi, how much is this?</p></div>
      <div class="msg in"><div class="print"><h3><span>Quote from your photo</span><span>SAMPLE</span></h3>${lines()}
        <div class="total"><span>Total</span><strong class="num">${Q.quote.total_display}</strong></div>
        <div class="dep"><span>70% deposit</span><span class="num">${Q.quote.deposit_display}</span></div></div>
        <p class="wait">Waiting for Aminat to confirm.</p></div></div></main>`,
];

const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;
function moveHighlight() { const el = items[current]; highlight.style.width = el.offsetWidth + 'px'; highlight.style.transform = `translateX(${el.offsetLeft}px)`; }
function mount(i) { stage.innerHTML = ''; requestAnimationFrame(() => { stage.innerHTML = variants[i](); }); }
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => { el.toggleAttribute('data-active', j === i); if (j === i) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current'); });
  moveHighlight();
  const url = new URL(location); url.searchParams.set('v', i + 1); history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
fetch('/app/src/site/demo-quote.json').then((r) => r.json()).then((d) => {
  Q = d;
  setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
  requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
});
</script>
</body>
</html>
